name: Build Play Store AAB

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-aab:
    name: Test & Build Signed Release AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure pre-installed Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_DIR/cmdline-tools"
            exit 1
          fi
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Validate Play signing secrets & decode upload keystore
        id: keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Play upload signing secrets. Configure UPLOAD_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD (key alias 'upload') in GitHub Repository Secrets."
            exit 1
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "has_play_json=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_json=false" >> "$GITHUB_OUTPUT"
          fi
          KEYSTORE_FILE="${RUNNER_TEMP}/my-upload-key.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_FILE"
          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build Play Store Release App Bundle (.aab)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload AAB and R8 mapping artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hid-forwarder-play-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Upload to Google Play Console (optional internal draft)
        if: steps.keystore.outputs.has_play_json == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.benkollo.hidfwd
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: draft

      - name: Attach AAB to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
